# ==============================================================================
# CLINOVA AI - LOCAL DOCKER COMPOSE DEPRECATED
#
# Local development on Windows has migrated to native PowerShell orchestration:
#   .\scripts\clinova.ps1 start          # Start all local services
#   .\scripts\clinova.ps1 start -Open    # Start and open browser
#   .\scripts\clinova.ps1 stop           # Stop all managed processes
#   .\scripts\clinova.ps1 status         # Check service and port health
#   .\scripts\clinova.ps1 doctor         # Diagnose dependencies and ports
#   .\scripts\clinova.ps1 health         # Probe application readiness
#   .\scripts\clinova.ps1 logs           # View service logs
#
# Docker Desktop, Linux containers, and WSL are NO LONGER REQUIRED for local development.
#
# For production/staging server container deployments, use:
#   docker compose -f infrastructure/docker/docker-compose.prod.yml up -d --build
# ==============================================================================
